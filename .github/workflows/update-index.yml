name: Update plugin index
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Accountant tag, e.g. v1.8.3.4
        required: true
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published release manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Update-Index.ps1 -Tag $env:RELEASE_TAG
      - name: Commit index update
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Update Accountant CN release index'
            git push
          } elseif ($LASTEXITCODE -ne 0) { throw 'git diff failed' }
